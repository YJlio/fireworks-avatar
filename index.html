<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟花之夜</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050816; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .sky-glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 110%, rgba(35, 45, 120, .28), transparent 55%),
                linear-gradient(180deg, rgba(3, 6, 24, .05), rgba(3, 6, 24, .35));
  }
  .title {
    position: fixed; top: 8vh; left: 50%; transform: translateX(-50%);
    width: max-content; text-align: center; pointer-events: none;
    text-shadow: 0 0 18px rgba(130, 190, 255, .8), 0 0 45px rgba(80, 90, 255, .45);
    animation: float 4s ease-in-out infinite;
  }
  .title h1 { margin: 0; font-size: clamp(2rem, 6vw, 4.8rem); letter-spacing: .22em; font-weight: 800; }
  .title p { margin: 12px 0 0; color: rgba(220, 232, 255, .78); letter-spacing: .35em; font-size: clamp(.7rem, 1.5vw, 1rem); }
  @keyframes float { 50% { transform: translate(-50%, -8px); } }
  .panel {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    border: 1px solid rgba(180, 205, 255, .22); border-radius: 18px;
    background: rgba(12, 18, 43, .55); backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .28); white-space: nowrap;
  }
  button {
    border: 0; border-radius: 12px; padding: 11px 18px; color: #071024;
    background: linear-gradient(135deg, #8cf4ff, #d9a7ff 55%, #ffb2d7);
    font: 700 14px inherit; font-size: 14px; font-weight: 800; cursor: pointer;
    box-shadow: 0 0 22px rgba(150, 190, 255, .28); transition: transform .15s, filter .15s;
  }
  button:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.12); }
  button:active { transform: scale(.97); }
  label { color: rgba(230, 238, 255, .82); font-size: 13px; }
  input[type="range"] { width: 94px; accent-color: #c6a8ff; vertical-align: middle; }
  .hint { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); color: rgba(215, 226, 255, .58); font-size: 12px; letter-spacing: .08em; white-space: nowrap; }
  @media (max-width: 520px) {
    .panel { gap: 9px; padding: 10px; }
    button { padding: 10px 13px; font-size: 12px; }
    label { font-size: 11px; }
    input[type="range"] { width: 68px; }
  }
</style>
</head>

  const colors = ['#ff4f81', '#ffd166', '#61f4de', '#8b7bff', '#ff9f43', '#f7f7ff', '#67a8ff'];
  const random = (a, b) => Math.random() * (b - a) + a;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.floor(w * h / 5000) }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: random(.35, 1.4), a: random(.18, .8), phase: random(0, 7)
    }));
  }

  function launch(x = random(w * .12, w * .88), y = random(h * .18, h * .62)) {
    const color = colors[Math.floor(Math.random() * colors.length)];
    rockets.push({ x: random(w * .18, w * .82), y: h + 8, tx: x, ty: y, color, speed: random(7, 10), trail: [] });
  }

  function burst(x, y, color) {
    avatarBursts.push({ x, y, started: performance.now(), duration: 1550, color });
    const count = Number(power.value);
    const style = Math.floor(random(0, 4));
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i / count) + random(-.035, .035);
      let speed = style === 1 ? random(2, 5) : random(1.3, 6.2);
      if (style === 2) speed *= (i % 2 ? .55 : 1.2);
      if (style === 3) speed = random(3, 6) * (i % 3 === 0 ? 1 : .72);
      particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        color: Math.random() < .18 ? colors[Math.floor(Math.random() * colors.length)] : color,
        life: random(48, 92), maxLife: 92, size: random(1, 2.8), drag: random(.982, .992), gravity: .045 });
    }
    // A few bright stars give the burst a sparkling center.
    for (let i = 0; i < 14; i++) particles.push({ x, y, vx: random(-2, 2), vy: random(-2, 2), color: '#fff', life: random(18, 36), maxLife: 36, size: random(1, 2), drag: .96, gravity: .015 });
  }

  function drawAvatarBursts(time) {
    avatarBursts = avatarBursts.filter(item => time - item.started < item.duration);
    for (const item of avatarBursts) {
      if (!avatar.complete || !avatar.naturalWidth) continue;
      const progress = Math.max(0, (time - item.started) / item.duration);
      const enter = Math.min(1, progress / 0.16);
      const fade = progress < 0.68 ? 1 : Math.max(0, (1 - progress) / 0.32);
      const size = Math.min(154, Math.max(94, Math.min(w, h) * 0.22)) *
        (0.66 + 0.34 * enter + 0.055 * Math.sin(progress * Math.PI * 3) * (1 - progress));
      const pulse = 4 * Math.sin(time * 0.012);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(item.x, item.y);
      ctx.rotate((progress - 0.5) * 0.09);
      ctx.shadowBlur = 28;
      ctx.shadowColor = item.color;
      ctx.strokeStyle = item.color;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, size * 0.53 + pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 18;
      ctx.shadowColor = "#ffffff";
      ctx.beginPath(); ctx.arc(0, 0, size * 0.49, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(avatar, -size / 2, -size / 2, size, size);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(item.x, item.y);
      ctx.rotate((progress - 0.5) * 0.09);
      ctx.shadowBlur = 22;
      ctx.shadowColor = item.color;
      ctx.strokeStyle = "rgba(255,255,255,.95)";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, size * 0.49, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  function frame(time) {
    ctx.fillStyle = 'rgba(5, 8, 22, 0.22)';
    ctx.fillRect(0, 0, w, h);
    for (const s of stars) {
      const twinkle = .55 + Math.sin(time * .0015 + s.phase) * .35;
      ctx.globalAlpha = s.a * twinkle;
      ctx.fillStyle = '#dce8ff'; ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    rockets = rockets.filter(r => {
      const dx = r.tx - r.x, dy = r.ty - r.y, dist = Math.hypot(dx, dy);
      r.trail.push({ x: r.x, y: r.y }); if (r.trail.length > 7) r.trail.shift();
      r.x += dx / dist * r.speed; r.y += dy / dist * r.speed;
      r.trail.forEach((p, i) => { ctx.globalAlpha = i / r.trail.length * .65; ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 14; ctx.shadowColor = r.color; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      if (dist < r.speed + 3) { burst(r.tx, r.ty, r.color); return false; }
      return true;
    });

    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.gravity; p.x += p.vx; p.y += p.vy; p.life--;
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color; ctx.shadowBlur = 9; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.55 + alpha * .45), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    drawAvatarBursts(time);
    requestAnimationFrame(frame);
  }

  document.getElementById('launch').addEventListener('click', () => launch());
  canvas.addEventListener('pointerdown', e => launch(e.clientX, e.clientY));
  window.addEventListener('resize', resize);
  resize();
  for (let i = 0; i < 3; i++) setTimeout(() => launch(), 450 + i * 700);
  setInterval(() => { if (Math.random() < .78) launch(); }, 1150);
  requestAnimationFrame(frame);
})();
